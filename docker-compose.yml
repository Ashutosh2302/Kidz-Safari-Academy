services:
  postgres:
    image: postgres:16-alpine
    container_name: gentle-sprouts-db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: sprouts
      POSTGRES_PASSWORD: sprouts
      POSTGRES_DB: gentle_sprouts
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
